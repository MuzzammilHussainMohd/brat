# ---------------------------------------------------------------------------
# Application-layer protocol.
#
# This is the part a GATT walk cannot see. `brat clone` captured the pipe
# below; this block describes the frames going through it.
#
#   7E 00 <dir> 10 20 <cmd> <len:u16be> <payload...> <crc16:be> EF
#
# CRC-16/MODBUS over everything from the start byte through the payload,
# serialised big-endian. The length is a full 16-bit field, so its high byte
# reads as a constant 0x00 in every short frame - easy to misread as padding
# until a longer response arrives.
# ---------------------------------------------------------------------------
protocol:
  name: glucosense-7e
  description: >
    Framed command protocol over NUS. No nonce, no signature, no session
    binding - a frame with a valid CRC is accepted on its merits.

  transport:
    write_uuid: 6e400002-b5a3-f393-e0a9-e50e24dcca9e
    notify_uuid: 6e400003-b5a3-f393-e0a9-e50e24dcca9e

  frame:
    fields:
      - {name: start,     type: const,  value: "7E"}
      - {name: reserved,  type: const,  value: "00"}
      - {name: direction, type: u8,     default: 0, description: "0=request, 1=ack, 2=push"}
      - {name: dst,       type: const,  value: "10"}
      - {name: src,       type: const,  value: "20"}
      - {name: cmd,       type: u8}
      - {name: length,    type: u16be,  length_of: payload}
      - {name: payload,   type: bytes,  length_from: length}
      - {name: crc,       type: crc}
      - {name: end,       type: const,  value: "EF"}

  crc:
    algorithm: crc16-modbus
    byte_order: big
    covers: [start, reserved, direction, dst, src, cmd, length, payload]

  commands:
    0x01: PING
    0x10: AUTH
    0x20: ALARM_SET
    0x30: STATUS
    0x40: TELEMETRY

  emulation:
    variables:
      # Firmware version the real unit reports in STATUS. A product constant,
      # not per-unit data - but it has to match what the device under test is
      # running, or a client that compares versions will notice.
      firmware_version: "01000001"
      # Reported glucose, big-endian u16. 0x006E = 110 mg/dL: a comfortably
      # normal reading, which is the point - an impersonator reports "fine"
      # regardless of what the real sensor says.
      reported_glucose: "006E"

    rules:
      - name: ping
        on_cmd: 0x01
        respond:
          - label: ping-ack
            delay: 0.05
            direction: 0x01
            cmd: 0x01
            payload: "01"

      # The identifier arrives here and is needed by later frames, so it is
      # captured into the session rather than reinvented.
      - name: auth
        on_cmd: 0x10
        description: accept any identifier, echo it back as authorised
        capture:
          uid: "{req.payload[0:8]}"
        respond:
          - label: auth-ack
            delay: 0.1
            direction: 0x01
            cmd: 0x10
            payload: "{req.payload[0:8]}01"

      # Echo the requested alarm state back as applied, so the client's UI
      # agrees with whatever it just asked for.
      - name: alarm-set
        on_cmd: 0x20
        respond:
          - label: alarm-ack
            delay: 0.05
            direction: 0x01
            cmd: 0x20
            payload: "{req.payload[0:1]}01"

      # [0:2] glucose u16be, [2] alarm active, [3] authenticated, [4:8] firmware.
      # Reports a normal reading with no alarm, whatever the real device shows.
      - name: status
        on_cmd: 0x30
        respond:
          - label: status-resp
            delay: 0.05
            direction: 0x01
            cmd: 0x30
            payload: "{var.reported_glucose}0001{var.firmware_version}"

      # [0] battery %, [1:3] sensor age hours u16be, [3:7] uptime u32be.
      - name: telemetry
        on_cmd: 0x40
        respond:
          - label: telemetry-resp
            delay: 0.05
            direction: 0x01
            cmd: 0x40
            payload: "540030{ts:u32be}"
