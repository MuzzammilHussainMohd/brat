# GlucoSense-SECURE - demo target configuration (secure v2 build)
#
# This is the SECURE version with SMP pairing, bonding, and MITM protection.
# Use this to demonstrate the contrast with the insecure v1 build.

CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- Bluetooth ------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GlucoSense-SECURE"
CONFIG_BT_DEVICE_APPEARANCE=0

# Larger ATT MTU so a whole frame fits in one write. The default of 23 caps
# payloads at 20 bytes, which would force the client to fragment and make
# the protocol harder to read in a session log.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=2

# --- Security (SMP) -------------------------------------------------------
# Enable Security Manager Protocol for pairing and encryption
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_BONDING_REQUIRED=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y

# Passkey/MITM protection - requires numeric passkey entry
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_FIXED_PASSKEY=y

# --- Bond storage (persistent pairing) ------------------------------------
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# --- Board support --------------------------------------------------------
CONFIG_DK_LIBRARY=y
CONFIG_GPIO=y

# --- Console / logging ----------------------------------------------------
# Serial console is how the audience sees the device's internal reaction to
# each frame while the attack is running.
#
# Deliberately NOT LOG_MODE_IMMEDIATE: that formats and writes each message
# synchronously on the calling thread's stack, and the Bluetooth callbacks
# here log from threads with stacks nowhere near large enough for it. It
# overflows within ~50ms of boot and puts the board in a reset loop, which
# presents as a device that advertises but never completes a connection.
# Deferred logging hands the work to a dedicated log thread instead.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Thread names and stack info make the next fault report name the culprit
# rather than saying "unknown".
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

# Needed for the DFU-decoy reboot.
CONFIG_REBOOT=y
